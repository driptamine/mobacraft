<!doctype html><html><head><meta charset="utf-8"><link rel="icon" href="data:,"><style>
:root { color-scheme:dark; }
* { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a0f; overflow:hidden; font-family:'Courier New',monospace; user-select:none; }
  #renderCanvas { width:100vw; height:100vh; display:block; touch-action:none; }

  /* Reinforce queue strip — now inside its own panel */
  #hud-reinforce {
    display:none; flex-direction:column; gap:3px; margin-top:2px;
  }
  #hud-reinforce-label {
    font-size:7.5px; letter-spacing:.12em; color:#50c8ff; opacity:.45;
  }
  #hud-reinforce-queue {
    display:flex; gap:3px; align-items:center; flex-wrap:wrap; overflow:hidden;
  }

  /* CoD-style crosshair: four long ticks with a clear gap in the middle. */
  #fps-crosshair {
    display:none; position:fixed; left:50%; top:50%; width:46px; height:46px;
    transform:translate(-50%,-50%); z-index:15; pointer-events:none;
    filter:drop-shadow(0 0 2px #000);
    background:
      linear-gradient(#7dff9a,#7dff9a) center 7px / 2px 12px no-repeat,
      linear-gradient(#7dff9a,#7dff9a) center calc(100% - 7px) / 2px 12px no-repeat,
      linear-gradient(#7dff9a,#7dff9a) 7px center / 12px 2px no-repeat,
      linear-gradient(#7dff9a,#7dff9a) calc(100% - 7px) center / 12px 2px no-repeat;
  }
  /* CoD-style hitmarker X: four diagonal ticks with a clear gap in the middle. */
  #fps-hitmarker {
    display:none; position:fixed; left:50%; top:50%; width:28px; height:28px;
    transform:translate(-50%,-50%); z-index:16; pointer-events:none;
    filter:drop-shadow(0 0 2px #000);
  }
  #fps-hitmarker::before, #fps-hitmarker::after {
    content:''; position:absolute; left:50%; top:50%; width:28px; height:2px;
    background:linear-gradient(to right, #fff 0 9px, transparent 9px 19px, #fff 19px 100%);
  }
  #fps-hitmarker::before { transform:translate(-50%,-50%) rotate(45deg); }
  #fps-hitmarker::after { transform:translate(-50%,-50%) rotate(-45deg); }
  #selBox {
    display:none; position:fixed;
    border:1.5px solid rgba(80,200,255,0.9);
    background:rgba(80,200,255,0.05); pointer-events:none; z-index:5;
  }
  #win {
    display:none; position:fixed; inset:0;
    background:rgba(0,0,0,0.75); backdrop-filter:blur(4px);
    justify-content:center; align-items:center; flex-direction:column; gap:16px; z-index:50;
  }
  #win h2 { font-size:36px; letter-spacing:.3em; color:#fff; }
  #win p { color:rgba(255,255,255,.5); font-size:13px; }
  #win button {
    background:rgba(10,10,20,.9); border:1px solid rgba(80,200,255,.5);
    color:#50c8ff; font-family:'Courier New',monospace; font-size:12px;
    letter-spacing:.15em; padding:10px 24px; cursor:pointer;
  }
  @keyframes mPing {
    0%   { transform:translate(-50%,-50%) scale(.3); opacity:1; }
    100% { transform:translate(-50%,-50%) scale(2.5); opacity:0; }
  }
  @keyframes mPingInner {
    0%   { transform:translate(-50%,-50%) scale(.3); opacity:0.9; }
    100% { transform:translate(-50%,-50%) scale(1.2); opacity:0; }
  }
  .move-marker {
    position:fixed; pointer-events:none; z-index:9999;
    width:28px; height:28px;
    border:2.5px solid #d0ffe6;
    border-radius:50%;
    animation:mPing .5s ease-out forwards;
    box-shadow:0 0 12px 3px #a0ffcc, 0 0 5px 1px #fff;
    background: radial-gradient(circle, rgba(180,255,210,0.18) 0%, transparent 70%);
  }
  #buildCursor { display:none; position:fixed; pointer-events:none; z-index:6; }
