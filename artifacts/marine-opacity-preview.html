 const mixer=new THREE.AnimationMixer(root);const idle=gltf.animations.find(clip=>clip.name==='idle_1')||gltf.animations.find(clip=>/idle/i.test(clip.name));if(idle)mixer.clipAction(idle).play();mixers.push(mixer);
