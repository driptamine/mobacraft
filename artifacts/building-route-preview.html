<!doctype html><html><head><meta charset="utf-8"><link rel="icon" href="data:,"><style>body{margin:0;background:#132019;color:#eee;font:14px Arial}aside{position:absolute;top:20px;left:20px;padding:15px;background:#08110bdc}canvas{display:block}</style></head><body><aside><b>Building navigation</b><p>Blue: squad · Yellow: worker · Green: APC</p><span id="status">Running movement systems…</span></aside><canvas id="canvas"></canvas><script type="module">
import * as THREE from 'three';import * as state from '/src/core/scene.ts';import {World} from '/src/core/ecs.ts';import * as E from '/src/entities/entities.ts';import * as S from '/src/core/systems.ts';import {worldFootprint,insideFootprint} from '/src/core/structure-footprint.ts';import {setDefaultScene} from '/src/render/three-helpers.ts';
window._currentMapKey='arena';const scene=new THREE.Scene();scene.background=new THREE.Color('#15241b');const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,1000);camera.position.set(60,85,88);camera.lookAt(0,0,0);camera.target=new THREE.Vector3();
state.__setSceneCameraForTests(scene,camera);setDefaultScene(scene);const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('canvas'),antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);scene.add(new THREE.HemisphereLight(0xffffff,0x334422,2));const sun=new THREE.DirectionalLight(0xfff0cc,2);sun.position.set(30,90,40);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(120,85),new THREE.MeshStandardMaterial({color:0x30483b}));ground.rotation.x=-Math.PI/2;scene.add(ground);const world=new World();state.setWorld(world);const structures=[];
for(const[type,x,z]of[['hq',0,0],['infantry_command',2,18],['plasma_generator',2,-18]]){
 const id=world.createEntity([]),site={type,team:'red',faction:'ig',hp:1000,position:new THREE.Vector3(x,0,z),constructing:false};world.add(id,'building',site);const bounds=worldFootprint(site);structures.push(bounds);const box=new THREE.Mesh(new THREE.BoxGeometry(bounds.maxX-bounds.minX,8,bounds.maxZ-bounds.minZ),new THREE.MeshStandardMaterial({color:type==='hq'?0x8b8c6e:0x5c7566}));box.position.set((bounds.minX+bounds.maxX)/2,4,(bounds.minZ+bounds.maxZ)/2);scene.add(box);
}
const squadID=E.createSquadEntity(world,'blue',-38,0,5,null,'ig'),squad=world.get(squadID,'squad');squad.moveOrder=new THREE.Vector3(38,0,0);squad.stopped=false;
for(const id of squad.soldiers.filter(Boolean)){const root=world.get(id,'mesh').root;const body=new THREE.Mesh(new THREE.CapsuleGeometry(.55,1.5,4,6),new THREE.MeshStandardMaterial({color:0x379bf0}));body.position.y=1.3;root.add(body)}
const workerID=E.createBuilderEntity(world,-38,-7,'blue','ig'),worker=world.get(workerID,'builder');worker.moveTarget=new THREE.Vector3(38,0,-7);const workerRoot=world.get(workerID,'mesh').root;const body=new THREE.Mesh(new THREE.CapsuleGeometry(.6,1.5,4,6),new THREE.MeshStandardMaterial({color:0xffc447}));body.position.y=1.3;workerRoot.add(body);
const apcID=E.createApcEntity(world,new THREE.Vector3(-38,0,7),'ig'),apc=world.get(apcID,'apc');apc.moveOrder=new THREE.Vector3(38,0,7);
const trailGroups=[{unit:squad,position:squad.position,color:0x379bf0,points:[]},{unit:worker,position:workerRoot.position,color:0xffc447,points:[]},{unit:apc,position:apc.position,color:0x7ce2a8,points:[]}];
let blockedSteps=0;for(let tick=0;tick<800;tick++){S.systemSquad(world,.025);S.systemBuilder(world,.025);S.systemApc(world,.025);S.systemStructureCollision(world,.025);for(const item of trailGroups){if(structures.some(b=>insideFootprint(item.position,b,.48)))blockedSteps++;if(tick%3===0)item.points.push(new THREE.Vector3(item.position.x,.15,item.position.z));}}
for(const item of trailGroups){const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(item.points),new THREE.LineBasicMaterial({color:item.color}));scene.add(line)}
renderer.render(scene,camera);window.__buildingRoutes={ready:true,blockedSteps,finished:trailGroups.every(item=>!item.unit.moveOrder&&!item.unit.moveTarget),positions:trailGroups.map(item=>item.position.toArray())};document.getElementById('status').textContent=JSON.stringify(window.__buildingRoutes);
</script></body></html>
