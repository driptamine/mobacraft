<!doctype html><html><head><meta charset="utf-8"><link rel="icon" href="data:,"><style>body{margin:0;background:#161b19;color:#cfffb2;font:14px sans-serif}nav{position:absolute;top:12px;left:16px;z-index:2}button{background:#12271a;color:#d4ffc0;border:1px solid #5ba44b;padding:9px;margin-right:6px}.labels{position:absolute;bottom:18px;width:100%;display:flex;justify-content:space-around;pointer-events:none}</style></head><body><nav><button data-mode="new">Новая аура</button><button data-mode="current">Текущая аура</button><button data-mode="off">Выключить</button></nav><div class="labels"><span>Necron Warrior</span><span>Obelisk</span><span>Plasma Generator</span><span>Thermoplasma Generator</span></div><script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';
import {GLTFLoader} from '/node_modules/three/examples/jsm/loaders/GLTFLoader.js';
import {NecronFootDust} from '/src/fx/necron-foot-dust.ts';
import {OrbitControls} from '/node_modules/three/examples/jsm/controls/OrbitControls.js';
import {addNecronAura,updateNecronAura} from '/src/fx/necron-aura.ts';
import {attachWarriorAurora,attachNecronStructureAurora,setNecronGlowMode,updateNecronAurora} from '/src/fx/necron-aurora.ts';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.setClearColor(0x18201b);document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.add(new THREE.HemisphereLight(0xe9ffed,0x554631,2));const light=new THREE.DirectionalLight(0xffe9c7,3);light.position.set(0,15,8);scene.add(light);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,200);camera.position.set(0,17,29);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,3,0);controls.update();
const floor=new THREE.Mesh(new THREE.PlaneGeometry(80,40),new THREE.MeshStandardMaterial({color:0x514634,roughness:1}));floor.rotation.x=-Math.PI/2;scene.add(floor);
const loader=new GLTFLoader();let ready=0;const mixers=[];let warrior;const dust=new NecronFootDust(()=>0);
for(const [index,model]of ['infantry/necron_basic_warrior','structures/obelisk','structures/plasma_generator','structures/thermoplasma_generator'].entries()){
 const gltf=await loader.loadAsync('/models/necrons/'+model+'.glb');const root=new THREE.Group();root.add(gltf.scene);root.position.x=(index-1.5)*7;scene.add(root);
 const bounds=new THREE.Box3().setFromObject(root);root.position.y-=bounds.min.y;
 if(index===0){warrior=root;root.scale.setScalar(2);root.position.y=0;addNecronAura(root);attachWarriorAurora(root);const mixer=new THREE.AnimationMixer(gltf.scene);const walk=gltf.animations.find(a=>/^move$|walk|run/i.test(a.name))||gltf.animations.find(a=>/^idle_1$/.test(a.name));if(walk)mixer.clipAction(walk).play();console.log('Warrior movement animation',walk?.name);mixers.push(mixer)}
 else attachNecronStructureAurora(root,model.split('/')[1]);ready++;
}
window.__necronPreview={scene,ready,renderer,camera,controls,warrior};setNecronGlowMode('new');
document.querySelectorAll('button').forEach(button=>button.onclick=()=>setNecronGlowMode(button.dataset.mode));
let previous=performance.now();function frame(now){const delta=Math.min(.05,(now-previous)/1000);previous=now;mixers.forEach(m=>m.update(delta));warrior.position.x=-10.5+Math.sin(now*.0008)*1.8;dust.update(delta,[warrior],scene);updateNecronAura(now/1000);updateNecronAurora(now/1000);renderer.render(scene,camera);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
