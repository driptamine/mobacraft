<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dota Particle Reader</title>
  <style>
    :root { color-scheme: dark; font: 15px/1.5 system-ui, sans-serif; background: #15171a; color: #e9e7e2 }
    * { box-sizing: border-box }
    body { margin: 0; padding: 28px clamp(16px, 4vw, 56px); max-width: 1480px; margin-inline: auto }
    h1 { margin: 0; font-size: 2rem; line-height: 1.15 }
    h2 { margin: 0; font-size: 1.35rem; overflow-wrap: anywhere }
    h3 { margin: 0 0 8px; font-size: .95rem }
    p { margin: 7px 0 }
    .muted, small { color: #abaeac }
    main { display: grid; grid-template-columns: minmax(240px, 305px) minmax(0, 1fr); gap: 20px; margin-top: 24px }
    aside, article { background: #1c1f23; border: 1px solid #383d42; border-radius: 10px; min-width: 0 }
    aside { position: sticky; top: 20px; align-self: start; display: flex; flex-direction: column; max-height: calc(100vh - 40px); padding: 14px }
    article { align-self: start; padding: 20px clamp(16px, 3vw, 30px) }
    label { display: block; font-size: .84rem; margin-bottom: 8px }
    input, select { display: block; width: 100%; margin-top: 4px; font: inherit; padding: 7px 9px; background: #15171a; color: inherit; border: 1px solid #51575c; border-radius: 5px }
    a { color: #addcc4; overflow-wrap: anywhere }
    a:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid #addcc4; outline-offset: 2px }
    nav { display: grid; gap: 3px; overflow: auto; padding: 3px }
    nav a { display: block; padding: 6px 8px; border-radius: 4px; color: inherit; text-decoration: none; font-size: .88rem }
    nav a:hover { background: #2c3336 }
    nav a[aria-current="true"] { background: #253a32; color: #bde8cf }
    nav small { display: block }
    #path, code, pre { font-family: ui-monospace, Menlo, monospace }
    #path { overflow-wrap: anywhere; font-size: .8rem }
    section, details { margin-top: 20px; padding-top: 15px; border-top: 1px solid #383d42 }
    #classes[hidden], section[hidden], details[hidden] { display: none }
    #classes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 12px }
    #classes div { padding: 10px; background: #15171a; border-radius: 5px }
    ul { margin: 0; padding-left: 19px }
    li { overflow-wrap: anywhere; margin: 3px 0 }
    pre { background: #15171a; padding: 14px; overflow: auto; border-radius: 5px; font-size: .8rem; max-height: 65vh }
    summary { cursor: pointer }
    .diagram-viewport { position: relative; height: clamp(245px, 32vw, 385px); overflow: hidden; border-radius: 5px; background: #101417 }
    .diagram-viewport canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100% }
    .diagram-controls { display: grid; grid-template-columns: 9rem minmax(0, 1fr); align-items: center; gap: 12px; margin-top: 9px }
    .diagram-controls input { margin: 0; padding: 0; accent-color: #addcc4 }
    .diagram-controls button { padding: 5px 8px; background: #253a32; color: #e9e7e2; border: 1px solid #51575c; border-radius: 4px; font: inherit }
    .diagram-controls button:disabled { opacity: .55 }
    .diagram-viewport[hidden], .diagram-controls[hidden] { display: none }
    @media (max-width: 660px) {
      main { grid-template-columns: 1fr; gap: 12px }
      aside { position: static; max-height: 35vh }
    }
  </style>
</head>
<body>
  <header>
    <h1>Dota Particle Reader</h1>
    <p id="source" class="muted" role="status"></p>
  </header>
  <main>
    <aside aria-label="Частицы Batch 1">
      <label>Герой<select id="hero"><option value="">Все герои</option></select></label>
      <label>Файл<input id="search" type="search" placeholder="Например, base_attack или hook"></label>
      <p id="count" class="muted" aria-live="polite"></p>
      <nav id="files" aria-label="Файлы частиц"></nav>
    </aside>
    <article>
      <h2 id="name">Загрузка архива</h2>
      <p id="path" class="muted"></p>
      <p id="status" role="status"></p>
      <section id="diagram" aria-labelledby="diagram-title" hidden>
        <h3 id="diagram-title">3D-схема VPCF</h3>
        <p class="muted">Перетаскивание вращает камеру. Движущиеся маркеры показывают связи между узлами.</p>
        <div class="diagram-viewport"></div>
        <div class="diagram-controls">
          <button type="button">Пауза</button>
          <input aria-label="Позиция анимации схемы" type="range" min="0" max="1000" value="0">
        </div>
        <p class="muted"><output></output></p>
      </section>
      <section id="classes" aria-label="Компоненты системы частиц" hidden></section>
      <section id="references" hidden><h3>Дочерние эффекты и зависимости</h3><ul></ul></section>
      <details id="data" hidden><summary>Открыть блок DATA (KV3)</summary><pre></pre></details>
    </article>
  </main>
  <script type="importmap">{"imports":{"three":"/three/three.module.js"}}</script>
  <script type="module">
    const byId = id => document.getElementById(id);
    const hero = byId('hero'), search = byId('search'), files = byId('files');
    const title = byId('name'), status = byId('status'), classes = byId('classes'), references = byId('references'), data = byId('data');
    const diagram = byId('diagram');
    const filename = path => path.split('/').at(-1);
    const selectedPath = () => new URLSearchParams(location.search).get('path');
    let rows = [];
    let selected = null;
    let request;
    let diagramRenderer;

    async function get(url, signal) {
      const response = await fetch(url, { signal });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error);
      return result;
    }

    function link(path, label) {
      const element = document.createElement('a');
      element.href = `?${new URLSearchParams({ path })}`;
      element.textContent = label;
      if (selected === path) element.setAttribute('aria-current', 'true');
      element.addEventListener('click', event => {
        if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
        event.preventDefault();
        if (selectedPath() !== path) history.pushState(null, '', element.href);
        void show(path);
      });
      return element;
    }

    function renderFiles() {
      const terms = search.value.trim().toLowerCase().split(/\s+/);
      const matches = rows.filter(row => (!hero.value || row.hero === hero.value)
        && terms.every(term => `${row.hero.toLowerCase()} ${row.path.toLowerCase()}`.includes(term)));
      byId('count').textContent = `${matches.length} из ${rows.length}`;
      files.replaceChildren(...matches.map(row => {
        const entry = link(row.path, filename(row.path));
        const label = document.createElement('small');
        label.textContent = row.hero;
        entry.append(label);
        return entry;
      }));
    }

    async function show(path) {
      if (!path) return;
      request?.abort();
      request = new AbortController();
      const { signal } = request;
      selected = path;
      files.querySelector('[aria-current]')?.removeAttribute('aria-current');
      files.querySelector(`a[href="?${new URLSearchParams({ path })}"]`)?.setAttribute('aria-current', 'true');
      title.textContent = filename(path);
      byId('path').textContent = path;
      status.textContent = 'Читаю архив…';
      classes.hidden = references.hidden = data.hidden = diagram.hidden = true;
      data.open = false;
      try {
        const result = await get(`/api/particle?${new URLSearchParams({ path })}`, signal);
        status.textContent = `${result.size.toLocaleString('ru-RU')} байт${result.maxParticles ? ` · максимум частиц ${result.maxParticles}` : ''}`;
        classes.replaceChildren(...Object.entries(result.classes).map(([group, names]) => {
          const box = document.createElement('div');
          const heading = document.createElement('h3');
          heading.textContent = group;
          const list = document.createElement('ul');
          for (const name of names) {
            const item = document.createElement('li');
            item.textContent = name;
            list.append(item);
          }
          box.append(heading, list);
          return box;
        }));
        classes.hidden = !classes.childElementCount;
        references.querySelector('ul').replaceChildren(...result.references.map(ref => {
          const item = document.createElement('li');
          if (ref.readable) item.append(link(`${ref.path}_c`, ref.path));
          else item.textContent = ref.path;
          if (ref.child) item.append(' · дочерний эффект');
          return item;
        }));
        references.hidden = !result.references.length;
        data.querySelector('pre').textContent = result.raw;
        data.hidden = false;
        diagram.hidden = false;
        diagramRenderer ??= import('/particle-diagram.js').then(module => module.mountParticleDiagram(diagram));
        diagramRenderer.then(draw => { if (!signal.aborted) draw(result); }).catch(() => {
          if (signal.aborted) return;
          diagram.querySelector('.diagram-viewport').hidden = true;
          diagram.querySelector('.diagram-controls').hidden = true;
          diagram.querySelector('output').textContent = 'WebGL недоступен. Структура VPCF показана ниже.';
        });
      } catch (error) {
        if (error.name !== 'AbortError') status.textContent = error.message;
      }
    }

    try {
      const index = await get('/api/particles');
      rows = index.rows;
      byId('source').textContent = `Batch 1 · ${index.archive} · структура частиц`;
      hero.append(...index.heroes.map(name => new Option(name, name)));
      hero.addEventListener('change', renderFiles);
      search.addEventListener('input', renderFiles);
      renderFiles();
      const initial = rows.find(row => filename(row.path) === 'drow_base_attack.vpcf_c') || rows[0];
      window.addEventListener('popstate', () => { void show(selectedPath() || initial.path); });
      void show(selectedPath() || initial.path);
    } catch (error) {
      title.textContent = 'Архив не загрузился';
      status.textContent = error.message;
    }
  </script>
</body>
</html>
